name: Login Token Webhook

on:
  push:
    branches:
      - 'main'
    paths:
      - 'login-token-webhook/**'
  workflow_dispatch:

jobs:

  login-token-webhook:
    name: Deploy Login Token Webhook Image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Publish Login Token Webhook Docker Image
        uses: openzim/docker-publish-action@v10
        with:
          image-name: kiwix/login-token-webhook
          on-master: latest
          restrict-to: kiwix/container-images
          context: login-token-webhook
          registries: ghcr.io
          credentials:
            GHCRIO_USERNAME=${{ secrets.GHCR_USERNAME }}
            GHCRIO_TOKEN=${{ secrets.GHCR_TOKEN }}
          platforms: |
            linux/amd64
            linux/arm64
